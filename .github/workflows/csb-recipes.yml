name: Check CSB for new recipes

on:
  schedule:
    # CSB usually uploads Sunday or Monday. Times are UTC (2 pm / 8 am Eastern).
    - cron: "0 18 * * 0,1"
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: csb-recipes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Look for new videos and add recipe cards
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node .github/scripts/update-recipes.js

      - name: Commit changes
        id: commit
        env:
          TITLES: ${{ steps.run.outputs.titles }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -f .github/csb-seen.json ]; then git add .github/csb-seen.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$TITLES" ]; then
              git commit -m "Add new CSB recipe card(s): $TITLES"
            else
              git commit -m "Record new CSB videos with no recipe"
            fi
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
